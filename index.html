<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PASSRESS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <button class="icon-btn menu-btn" aria-label="Menu">
      <span></span>
      <span></span>
    </button>

    <div class="header-actions">
      <button class="icon-btn view-toggle" aria-label="Change view" title="Change view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3.5" y="5" width="7" height="14" />
          <rect x="13.5" y="5" width="7" height="14" />
        </svg>
      </button>

      <button class="text-btn filters-btn">FILTERS</button>

      <button class="icon-btn search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="11" cy="11" r="6.5" />
          <line x1="16" y1="16" x2="21" y2="21" />
        </svg>
      </button>

      <button class="icon-btn cart-btn" aria-label="Shopping bag">
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="product-grid cols-2" id="product-grid">
      <!-- Product cards rendered by app.js -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
