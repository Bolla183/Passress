version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon
      POSTGRES_DB: tryon
    ports:
      - "5432:5432"
    volumes:
      - tryon-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tryon-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/passress-tryon;
      "

  api:
    build: .
    command: node dist/index.js
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8080:8080"

  worker:
    build: .
    command: node dist/worker.js
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  tryon-postgres:
  tryon-minio:
